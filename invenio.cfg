def _(x):  # needed to avoid start time failure with lazy strings
    return x


hostname = "127.0.0.1:5000"
admin_email = f"info@{hostname}"


# Get some partial config items from the environment variables (e.g. ".env" file)
# to build up full ones below (e.g. DB connection string)
#
# Note that Invenio generally reads configuration items from env vars, if
# they are prefixed with "INVENIO_" and these values support Python syntax
# e.g. INVENIO_SEARCH_HOSTS='["localhost:9200", "search:9200"]' sets the Flask config
# `app.config["SEARCH_HOSTS"] = ["localhost:9200", "search:9200"]`
# (note the env var value being a string, and the parsed config being a list)
db_user = getenv("INVENIO_DB_USER")
db_pw = getenv("INVENIO_DB_PASSWORD")
db_host = getenv("INVENIO_DB_HOST", "localhost")
mq_user = getenv("INVENIO_MQ_USER")
mq_pw = getenv("INVENIO_MQ_PASSWORD")


# Flask
# =====
# See https://flask.palletsprojects.com/en/1.1.x/config/

# Define the value of the cache control header `max-age` returned by the server when serving
# public files. Files will be cached by the browser for the provided number of seconds.
# See flask documentation for more information:
# https://flask.palletsprojects.com/en/2.1.x/config/#SEND_FILE_MAX_AGE_DEFAULT
SEND_FILE_MAX_AGE_DEFAULT = 300

# Since HAProxy and Nginx route all requests no matter the host header
# provided, the trusted hosts variable is set to localhost. In production it
# should be set to the correct host and it is strongly recommended to only
# route correct hosts to the application.
TRUSTED_HOSTS = ["localhost", "127.0.0.1", hostname]


# Flask-SQLAlchemy
# ================
# See https://flask-sqlalchemy.palletsprojects.com/en/2.x/config/

db_uri = getenv("INVENIO_SQLALCHEMY_DATABASE_URI")
if db_uri is None:
    db_uri = f"postgresql+psycopg2://{db_user}:{db_pw}@{db_host}/nsu-inveniordm"

# Abort if we can't build a DB connection string, as that's pretty important
if db_uri is None:
    raise ValueError("DB connection string (INVENIO_SQLALCHEMY_DATABASE_URI) is not set!")

SQLALCHEMY_DATABASE_URI = db_uri

# Put the updated connection string into the environment again;
# otherwise, the old value might override what we've set a few lines above
environ["INVENIO_SQLALCHEMY_DATABASE_URI"] = SQLALCHEMY_DATABASE_URI


