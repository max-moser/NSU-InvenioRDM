# Backend services needed for development.
#
# This file will start all the backend services needed to run InvenioRDM
# locally in development mode.
#
# Usage::
#
#   $ docker compose up -d
#
# Following services are included:
# - Cache: Redis (exposed port: 6379)
# - DB: PostgreSQL (exposed port: 5432)
# - Message queue: RabbitMQ (exposed ports: 5672, 15672)
# - OpenSearch (exposed ports: 9200, 9600)
# - Kibana (view OS indexes) (exposed ports: 5601)
#
services:
  cache:
    extends:
      file: docker-services.yml
      service: cache
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: 2
  db:
    extends:
      file: docker-services.yml
      service: db
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: 2
  mq:
    extends:
      file: docker-services.yml
      service: mq
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: 2
  search:
    extends:
      file: docker-services.yml
      service: search
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: 2
  opensearch-dashboards:
    extends:
      file: docker-services.yml
      service: opensearch-dashboards
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: 2
  pgadmin:
    extends:
      file: docker-services.yml
      service: pgadmin
    logging:
      driver: json-file
      options:
        max-size: 512m
        max-file: 2

volumes:
  cache-data:
  db-data:
  mq-data:
  search-data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
